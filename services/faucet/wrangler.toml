name = "avakit-faucet"
main = "src/worker.js"
compatibility_date = "2026-07-01"
# viem pulls in a few Node built-ins (crypto/buffer) for signing.
compatibility_flags = ["nodejs_compat"]

[vars]
# What a drip has to pay for: avakit.dev/new deploys the nft-mint template's
# contract and mints from it, 1,826,568 gas in all (deploy 1,714,358 + mint
# 112,210). 0.02 AVAX covers that while the fee per gas stays under about
# 10.9 nAVAX (0.02 AVAX / 1,826,568 gas) — a little less in practice, because a
# wallet must hold gas × maxFeePerGas before it can send, and viem asks for 1.2
# times the base fee plus the tip. Fuji's fee is dynamic and its minimum is far
# below that today, but this is not a worst-case amount: at the 25 nAVAX the
# base fee used to sit at, the same two transactions cost about 0.046 AVAX and a
# drip would not even pay for the deploy. Measure again when that contract
# changes. Note the real cost per visitor is the *drip*, not the gas — the
# remainder is stranded in a throwaway wallet forever.
FAUCET_DRIP_AVAX = "0.02"
# Left open on purpose: CORS is a browser rule, not a security boundary (a bot can
# POST directly anyway), and the faucet's callers are scaffolded apps on any origin
# and the MCP server, which sends no Origin at all. PROTECTION.md has the details.
FAUCET_CORS_ORIGIN = "*"
# The most drips sent per UTC day, over all callers, so that the most a drain can
# take in a day is known in advance: 50 × 0.02 AVAX = 1 AVAX a day from the
# unverified budget (every request without a verified Turnstile token: the MCP
# server, scaffolded apps, avakit.dev today) plus 100 × 0.02 = 2 AVAX from the
# verified one, each drip also paying at most 100,000 gas. Real use is a few drips
# a day; raise these for an event, and keep them small next to the balance.
FAUCET_DAILY_DRIPS = "50"
FAUCET_DAILY_DRIPS_VERIFIED = "100"
# GET /health reports "low": true under this balance (AVAX), and the monitor
# workflow opens an issue. 1 AVAX is 50 drips at 0.02: one day's worst case while
# Turnstile is off. Keep it at one day's worst case or more, so raise it to 3
# before setting TURNSTILE_SECRET (README, "Turnstile").
FAUCET_LOW_BALANCE_AVAX = "1"
# The origins that must send a Turnstile token. It does nothing until the
# TURNSTILE_SECRET secret is set; with both, a request from avakit.dev needs a
# token, while every other origin (and the MCP server, which sends none) may come
# without one and draws on the unverified budget. Do not set the secret before
# avakit.dev/new sends a token: README, "Turnstile". On a faucet of your own that
# already has the secret and wants a token from every caller, set this to "" (or
# your own origins) before deploying: README, "Upgrading to the daily budgets".
TURNSTILE_ORIGINS = "https://avakit.dev"

# The rate limits and the send queue live in one SQLite-backed Durable Object per
# chain, not in KV: a KV counter is read, awaited on and written back, so a burst
# of requests all read the same value, and nothing in KV can stop two drips from
# signing the same nonce. The object sees every request in order.
[[durable_objects.bindings]]
name = "FAUCET"
class_name = "Faucet"

# `new_sqlite_classes` (not `new_classes`) is required: only the SQLite storage
# backend is available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Faucet"]

# Keep what the Worker logs (a failed drip logs the reason; callers only ever get
# a fixed message) so it can be read in the dashboard afterwards, not just live
# in `wrangler tail`. Invocation logs are off so no visitor's IP is stored.
[observability.logs]
enabled = true
invocation_logs = false

# Secrets, never vars:
#   npx wrangler secret put AVAKIT_FAUCET_KEY   (required — a throwaway Fuji key)
#   npx wrangler secret put TURNSTILE_SECRET    (optional — turns the captcha on)
#   npx wrangler secret put FAUCET_FUJI_RPC     (optional — your own RPC; a
#                                                provider's URL carries its API key)
# For `wrangler dev`, put them in .dev.vars instead (gitignored).
#
# The kill switch is set the same way, so that it takes effect at once and no
# deploy can switch it off again (a deploy deletes vars set in the dashboard):
#   echo 1 | npx wrangler secret put FAUCET_PAUSED     pause POST /fund
#   npx wrangler secret delete FAUCET_PAUSED           resume
#
# GIT_SHA is not set here: the deploy workflow passes the commit it deploys
# (`wrangler deploy --var GIT_SHA:<sha>`), and GET /health reports it as
# `version`. A Worker deployed any other way reports "dev".
