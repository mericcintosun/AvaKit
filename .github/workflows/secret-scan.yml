# Secret scan of the git history with gitleaks, on top of GitHub's own secret
# scanning and push protection (which know the formats of specific providers'
# tokens; gitleaks also has generic rules, for example a 64-hex private key
# assigned to a variable).
#
#   - A push or a pull request scans the full history of the commit under test.
#   - The weekly and the hand-started runs scan every branch and tag.
#
# A finding fails the run. Its log shows the rule, file, line and commit, with
# the value itself redacted. A real secret is revoked first and removed after.
# A value that is public on purpose is acknowledged in one of two files at the
# repository root, with a comment that says what it is:
#   - .gitleaks.toml, the configuration gitleaks reads from there, allows a
#     value wherever it appears (a published test key) or one kind of value in
#     one file (the digests contracts-ci pins). It also keeps gitleaks' default
#     rules on, which the step before the scan checks with a planted key.
#   - .gitleaksignore acknowledges one finding by its fingerprint, the
#     "Fingerprint:" line of the finding (a client id that ships to every
#     browser). A fingerprint names a commit, so after a rebase or a squash
#     merge the same value is a new finding.
# To scan locally the same way:
#   gitleaks git --redact --log-opts="--full-history --all" .
#
# The gitleaks binary is downloaded from its GitHub release at a pinned
# version and checked against the SHA-256 of that release's Linux tarball, as
# listed in gitleaks_<version>_checksums.txt. To move to a newer version,
# change both values together. (gitleaks-action is not used. It needs no
# license key for a repository of a personal account, but its own license is
# not MIT, and it comments on pull requests with the job's token; the binary
# needs no token at all.)
name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Nothing here restores or saves an Actions cache.
cache-mode: none

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan · gitleaks · full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every branch and tag, with their full history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # A scan that finds nothing means something only if the configuration
      # still finds a key: a random 64-hex value assigned to api_key, in a
      # throwaway directory, scanned with .gitleaks.toml, must be reported
      # (exit code 99 here). This fails when the file stops extending the
      # default rules, or allows too much.
      - name: Check that the configuration still finds a planted key
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          printf 'api_key = "%s"\n' "$(openssl rand -hex 32)" > "$canary/settings.env"
          status=0
          gitleaks dir --redact --no-banner --config .gitleaks.toml --exit-code 99 "$canary" || status=$?
          if [ "$status" -ne 99 ]; then
            echo "::error title=Secret scan::.gitleaks.toml did not report a planted key (gitleaks exited ${status})"
            exit 1
          fi

      - name: Scan the history
        env:
          SCOPE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--all' || 'HEAD' }}
        run: |
          gitleaks version
          gitleaks git --redact --no-banner --verbose --log-opts="--full-history ${SCOPE}" .
