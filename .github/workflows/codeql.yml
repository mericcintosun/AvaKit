# Static analysis with CodeQL, GitHub's code scanner, for two languages:
#   - javascript-typescript: every package, the website, the templates, the
#     Workers and the repo scripts. Nothing is built first (build-mode: none).
#   - actions: the workflows in .github/workflows (script injection, unsafe
#     triggers, overly broad tokens, untrusted checkouts).
# Results go to the repository's Security tab (Code scanning), where an alert
# is triaged and dismissed or fixed. A pull request that introduces an alert
# shows it on the pull request.
#
# This is CodeQL's advanced setup. Leave code scanning's "default setup" off in
# the repository settings: GitHub does not accept results from both.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries also run over code that has not changed.
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
