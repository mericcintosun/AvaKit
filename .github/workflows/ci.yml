name: CI

# No trigger here is path-filtered, and none may be: the main branch ruleset
# requires the "CI passed" job below, and a pull request whose run never starts
# would wait for that check forever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Runs CI on any branch by hand, or from another workflow:
  #   gh workflow run ci.yml --ref <branch>
  # GitHub holds the pull_request runs of a pull request that GITHUB_TOKEN
  # opened or updated (the "chore: version packages" PR) for approval, and runs
  # none of their jobs until someone with write access approves them; a
  # workflow_dispatch run that GITHUB_TOKEN asks for starts at once. The
  # dispatched run's checks land on the branch's head commit, which is the pull
  # request's head commit, so they count for the pull request's required "CI
  # passed" check.
  workflow_dispatch:

# Read-only. No job here pushes, comments or publishes; a job that needs more
# says so itself.
permissions:
  contents: read

# Cancel in-progress runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck, build and test the workspace on the oldest Node.js line the
  # published packages declare (engines.node ">=22") and on the line the repo is
  # developed on (.nvmrc). setup-node installs the newest release of each line,
  # which also meets the root package.json's ">=22.18" (from 22.18.0 on, Node.js
  # 22 runs the .ts files the website's tests import without a flag). The
  # published packages also run on Node.js 26 in e2e-fuji.yml. One version
  # failing does not cancel the other (fail-fast: false), so a red leg says
  # which Node.js it is.
  verify:
    name: Lint · Typecheck · Build · Test · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      # The repo's own tooling, which no package test covers. The self-tests check
      # that the smoke script keeps the scaffolder's telemetry off and removes its
      # temporary directory, that turbo.json still passes a telemetry opt-out
      # through to the tasks turbo runs, and that the workflows keep their gates
      # (release.yml publishes only after the checks, and this file's "CI passed"
      # job waits for every other job). The parity check fails when two templates
      # pin different versions of a dependency they share: the templates are not
      # workspace members and Dependabot is not pointed at them (see
      # .github/dependabot.yml), so nothing else keeps them in step.
      - name: Repo scripts · template dependency parity
        run: |
          node --test scripts/*.test.mjs
          node scripts/check-template-deps.mjs

      # The scaffolder installs with npm unless it was launched by another package
      # manager, and a machine with only Node.js has no pnpm, yarn or bun. This
      # fails when a template's README, CLAUDE.md, llms.txt, script hint or UI tells
      # its reader to run a pnpm, yarn or bun command, naming the file and line;
      # the commands a scaffolded app shows are written for npm.
      - name: Repo scripts · template commands are written for npm
        run: node scripts/check-template-commands.mjs

      # @avakit/mcp is published with @avakit/core bundled inside it, so core is
      # a devDependency of the server and Changesets no longer releases the
      # server when core is released. This fails when a pending changeset bumps
      # @avakit/core and none bumps @avakit/mcp, naming the changesets.
      - name: Changesets · a bundled package is released with the package that contains it
        run: node scripts/check-changesets.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Known vulnerabilities in the locked dependency trees: the workspace
  # (pnpm-lock.yaml) and the two Workers (their own package-lock.json files). A
  # high or critical advisory fails the job; moderate and low ones are listed in
  # the log and pass. Nothing is installed, so no dependency code runs here: each
  # audit reads a lockfile and asks the npm registry. To accept one advisory on
  # purpose, add its GHSA id to auditConfig.ignoreGhsas in pnpm-workspace.yaml,
  # with a comment that says why.
  audit:
    name: Audit · high and critical advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Workspace (pnpm-lock.yaml)
        run: pnpm audit --audit-level=high

      # The Workers run even when an audit above failed, so one red run lists
      # every lockfile that needs attention.
      - name: Faucet Worker (services/faucet)
        if: ${{ !cancelled() }}
        working-directory: services/faucet
        run: npm audit --audit-level=high

      - name: Telemetry Worker (services/telemetry)
        if: ${{ !cancelled() }}
        working-directory: services/telemetry
        run: npm audit --audit-level=high

  # The dependencies a pull request adds or changes, compared base against head
  # in GitHub's dependency graph: one with a known high or critical advisory
  # fails the job, whatever its scope. (Left to its default, the action fails on
  # runtime dependencies only, and the graph scopes the devDependencies of each
  # package.json and the Workers' wrangler trees as development.) It runs for
  # pull requests only, and is the one job "CI passed" lets be skipped, on a
  # push or a dispatched run.
  dependency-review:
    name: Dependency review · new high and critical advisories
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review the dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  # Scaffold every create-avalanche-app template from the LOCAL build and verify it
  # installs, type-checks, and production-builds — the real `npm create avalanche-app`
  # flow. One broken template fails only its own matrix leg (fail-fast: false).
  # Templates that need avalanche-cli at runtime (icm-messenger, l1-launch,
  # token-bridge) are scaffold+typecheck+build tested only; their devnet/L1 scripts
  # are not exercised here (no avalanche-cli in CI).
  #
  # @avakit/* is packed from THIS repo and injected as pnpm overrides, so a template
  # that needs an unpublished core feature is verified before release. Run
  # `SMOKE_USE_NPM=1 scripts/smoke-template.sh <id>` after a release to verify the
  # per-package pins the scaffolder stamps really resolve from npm.
  #
  # The script switches the scaffolder's telemetry off itself, so a smoke run is
  # never counted as usage, here or on a developer's machine.
  smoke-templates:
    name: Smoke · ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template:
          - minimal
          - nft-mint
          - token-gated-app
          - erc20-token
          - icm-messenger
          - eerc-token
          - l1-launch
          - token-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @avakit/* and the scaffolder
        run: pnpm --filter "@avakit/core" --filter "@avakit/react" --filter create-avalanche-app build

      - name: Scaffold + typecheck + build "${{ matrix.template }}"
        run: bash scripts/smoke-template.sh "${{ matrix.template }}" "$RUNNER_TEMP/smoke"

  # Install @avakit/mcp the way a user's machine does and drive the installed
  # server. The package's own tests run against the source; this is the only
  # check of the tarball. It packs create-avalanche-app and @avakit/mcp, installs
  # both with npm into an empty project with an EMPTY npm cache, and fails if
  # viem, zod, the MCP SDK or @avakit/core were installed as packages: they must
  # be bundled into the server's dist/index.js, because every package is a
  # download between `npx -y @avakit/mcp` and the server's first answer, and an
  # MCP client only waits 30 seconds for that. It then runs `avakit-mcp
  # --version`, speaks JSON-RPC to the installed server over stdio (initialize,
  # tools/list, list_templates, scaffold_app) and prints what the install cost:
  # packages, megabytes, seconds.
  #
  # The script contacts the npm registry only, and switches telemetry off itself.
  smoke-mcp:
    name: Smoke · @avakit/mcp install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @avakit/core, the scaffolder and the MCP server
        run: pnpm --filter "@avakit/core" --filter create-avalanche-app --filter "@avakit/mcp" build

      - name: Pack + install with an empty npm cache + drive the installed server
        run: bash scripts/smoke-mcp.sh "$RUNNER_TEMP/smoke-mcp"

  # Compile and test the Solidity the repo ships, and verify that every bytecode
  # artifact generated from it still matches its source: each template's
  # lib/*-artifact.ts, the demo token inside token-bridge's
  # lib/ictt-artifacts.json (it is the erc20-token contract), the messenger
  # bytecode Studio deploys, the contract the website's /new page deploys and
  # the example app's artifact. The artifacts live away from their sources, so
  # nothing else guards against silent drift.
  # The sync step also fails when templates that share a contract no longer ship
  # identical copies, or when any foundry.toml compiles with different settings
  # than contracts-ci: the tested and the shipped bytecode must come from the
  # same compiler. The last step tests the two guard scripts themselves: each
  # is run against a copy of the files it reads with one thing changed, and has
  # to notice. See contracts-ci/README.md. Foundry is pinned to a stable
  # release so local and CI builds emit identical bytecode (the compiler itself
  # is pinned in the foundry.toml files).
  contracts:
    name: Contracts · forge test · artifact parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1

      - name: Sync template contracts (copy identity · compiler settings)
        working-directory: contracts-ci
        run: node scripts/sync.mjs

      - name: Forge tests
        working-directory: contracts-ci
        run: forge test -vvv

      - name: Artifact parity (every shipped artifact vs its source)
        working-directory: contracts-ci
        run: node scripts/check-artifacts.mjs

      - name: Guard self-tests (sync and artifact parity still catch what they are for)
        working-directory: contracts-ci
        run: node --test scripts/guards.test.mjs

  # The two Cloudflare Workers are standalone npm projects outside the pnpm
  # workspace, each with its own package-lock.json, so `pnpm test` in the verify
  # job never reaches their tests. Their suites use Node's built-in test runner
  # and need Node 22.15 or newer.
  services:
    name: Services · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - faucet
          - telemetry
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: npm test

  # The one check the main branch ruleset requires. It waits for every other
  # job and fails unless each one succeeded, so the ruleset names a single check
  # however many jobs and matrix legs this file grows. It runs even when a job it
  # waits for failed or was cancelled (`if: always()`), because a skipped job's
  # check counts as passing for a ruleset. dependency-review may be skipped, and
  # only on a push or a dispatched run, where it does not run.
  #
  # A job added to this file must be added to `needs` below as well;
  # scripts/workflows.test.mjs fails until it is.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - verify
      - audit
      - dependency-review
      - smoke-templates
      - smoke-mcp
      - contracts
      - services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          failed=$(jq -r --arg may_skip "$MAY_SKIP" '
            to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or .key != $may_skip)
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while IFS= read -r line; do
              echo "::error title=CI passed::$line"
            done <<< "$failed"
            exit 1
          fi
