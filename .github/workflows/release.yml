# Version the packages, or publish them to npm.
#
# Runs on every push to main, and from Run workflow. Each job holds only what
# it needs, and the one that can mint an npm publish credential runs no code
# of this repository and none of its dependencies:
#
#   verify   contents: read. The gates (lint, typecheck, tests, the changeset
#            check, the MCP install smoke test) on the commit that is about to
#            be versioned or published, then whether changesets are pending.
#   version  Pending changesets only. contents: write, pull-requests: write.
#            changesets/action opens or updates the "chore: version packages"
#            PR (branch changeset-release/main) and publishes nothing. GitHub
#            holds that PR's CI runs until a maintainer approves them (see the
#            job).
#   pack     Nothing pending on main, or a dry run. contents: read. A fresh
#            checkout of the same commit, installed without install scripts:
#            builds and packs every publishable package, records each
#            tarball's sha256 and whether npm already has that version, and
#            uploads the tarballs.
#   publish  Nothing pending and something npm does not have yet. Waits for a
#            reviewer to approve the npm-publish environment, then publishes
#            the uploaded tarballs with npm trusted publishing (OIDC) and a
#            provenance attestation. id-token: write and contents: read, no
#            checkout, no install.
#   tag      contents: write. The git tag and the GitHub release of every
#            package that was published, as changesets/action made them.
#
# Run workflow with "dry run" ticked (the default) runs verify, pack and then
# `npm publish --dry-run` on the tarballs, in a job with no environment and no
# id-token: the publish path end to end, publishing nothing. npm refuses a
# version it already has even in a dry run, so on main that job checks the
# tarballs and finds nothing to publish; run it on changeset-release/main to
# rehearse the version PR's publish before merging it. With "dry run"
# unticked on main it is a release like a push.
#
# What can still change a tarball is the build. The tests and the smoke test
# (which installs the packed server with npm, install scripts and all) run in
# verify, on another runner, and never touch the tarballs; pack runs only the
# packages' builds and `pnpm pack`. A compromised build tool can still change
# what it builds, but it cannot publish by itself: publishing needs the
# approval, publishes exactly the bytes pack summed, and npm's provenance
# attestation names this workflow and commit. See RELEASING.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: verify, pack, then npm publish --dry-run. Untick to release main for real."
        type: boolean
        default: true

# Nothing by default: every job states its own permissions.
permissions: {}

# No job restores or saves an Actions cache, and GitHub enforces that. A cache
# entry is saved by whichever run on main first used its key (ci.yml saves the
# pnpm store that way), and what a restore brought in would run in the gates
# and be built into the tarballs that are published. Every setup-node also
# says package-manager-cache: false, so no step asks for one.
cache-mode: none

# One release at a time per branch, as before. A dry run queues on its own, so
# it can never take the place of a release that is waiting to start.
concurrency:
  group: release-${{ github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.state.outputs.pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache (see cache-mode above).
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate: nothing is versioned or published from a red tree.
      #
      # ci.yml runs the same checks on this push, but as a separate workflow
      # that this one does not wait for. So the checks run here as well, on the
      # exact commit that is about to be versioned or published, and a failure
      # stops this job, which every other job needs.
      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # @avakit/mcp carries @avakit/core inside its bundle, so Changesets does not
      # bump the server when core is released. This fails when a pending changeset
      # bumps core and none bumps the server, before the version PR is opened with
      # the server left behind. With no pending changesets (the publish run) it
      # passes.
      - name: Changesets · a bundled package is released with the package that contains it
        run: node scripts/check-changesets.mjs

      # The tarball itself. The tests above run the source; this packs the server,
      # installs it with an empty npm cache and drives the installed binary, which
      # is what catches a package that is green in the workspace and does not
      # start on a user's machine. (These tarballs are not the ones published:
      # the pack job packs its own.)
      - name: Smoke · the packed MCP server installs and starts
        run: bash scripts/smoke-mcp.sh "$RUNNER_TEMP/smoke-mcp"

      # pending=true: the version job runs. pending=false: on main, the pack job
      # packs the packages, and the publish job runs if npm lacks one of their
      # versions.
      - name: Changesets · are versions pending?
        id: state
        run: node scripts/release-packages.mjs state

  # The version PR's CI. changesets/action opens and updates the PR with
  # GITHUB_TOKEN, and GitHub creates the pull_request runs of a PR that
  # GITHUB_TOKEN opened or updated in an approval-required state: they have no
  # jobs until someone with write access clicks "Approve workflows to run" on
  # the PR, and every update of the PR needs that click again. (GitHub docs,
  # "Triggering a workflow from a workflow":
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow;
  # changelog: "Bot-created pull requests can run workflows if approved".)
  # Approved, they are the PR's own runs, and their "CI passed" is the check
  # the main branch ruleset requires. Left alone, a merge closes them as failed
  # with no jobs, which the Actions tab calls a workflow file issue: runs
  # 44558954539 and 44565792970 of #29 and #31.
  #
  # Starting ci.yml on the PR's branch from here, with workflow_dispatch, would
  # not stand in for that click: GitHub counts the checks of a workflow job for
  # a pull request only when an event such as push or pull_request started the
  # run, so the checks of a dispatched run neither show on the PR nor satisfy a
  # required check. (GitHub docs, "Troubleshooting required status checks":
  # https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks.)
  # Opening the PR with a GitHub App token instead lets its runs start without
  # the click, at the cost of a long-lived private key; see RELEASING.md.
  version:
    name: Version · open or update the version PR
    needs: verify
    if: github.ref == 'refs/heads/main' && !inputs.dry_run && needs.verify.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open or update the PR
    steps:
      # The credentials stay in the checkout: changesets/action pushes the
      # version branch with them.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The gates ran in verify on this same commit. All that runs here is
      # `changeset version` and the server.json sync of `pnpm version-packages`,
      # so no install script runs next to a token that can push.
      - name: Install (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Opens or updates the "chore: version packages" PR. The PR is produced
      # by `pnpm version-packages`: `changeset version`, then @avakit/mcp's
      # `sync:server-json`, so the MCP Registry listing moves with the version.
      #
      # `publish` is never run: the action runs it only when no changesets are
      # pending, and this job runs only when some are. It is set because the
      # action words the PR body by it ("merge this and the packages will be
      # published to npm automatically"); without it the PR would tell its
      # reader to publish by hand, which npm refuses for these packages. If it
      # ever runs, it fails.
      - name: Open or update the version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: node -e "console.error('release.yml publishes in its publish job only.'); process.exit(1)"
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The tarballs, packed apart from everything verify ran. This job starts from
  # a fresh checkout of the same commit on a runner of its own, installs the
  # dependencies without running a single install script, and runs only the
  # packages' builds (tsup, vite and the build scripts in packages/*) and
  # `pnpm pack`: no test, no smoke test, nothing installed from npm with its
  # scripts.
  pack:
    name: Pack · tarballs
    needs: verify
    if: inputs.dry_run || (github.ref == 'refs/heads/main' && needs.verify.outputs.pending == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.pack.outputs.unpublished }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache (see cache-mode above).
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the packages
        run: pnpm exec turbo run build --filter='./packages/*'

      # `pnpm pack` writes the real versions over the workspace: and catalog:
      # ranges, as publishing does, and the script fails if one is left. It
      # writes manifest.json (name, version, file, sha256, integrity and
      # whether npm has the version, for each tarball) and SHA256SUMS.
      - name: Pack every publishable package
        id: pack
        run: node scripts/release-packages.mjs pack "$RUNNER_TEMP/release"

      - name: Upload the tarballs
        if: inputs.dry_run || steps.pack.outputs.unpublished != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          # A deployment waits at most 30 days for its approval.
          retention-days: 30

  # Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN exists. Each
  # package's Trusted Publisher on npmjs.com must name this repository, this
  # file (release.yml) and the npm-publish environment (RELEASING.md, "One-time
  # setup"). Until it names the environment, npm accepts an id-token from any
  # run of release.yml, on any branch, in any job given id-token: write, and
  # the approval below is GitHub's alone. The exchanged id-token also produces
  # the provenance attestation.
  #
  # Nothing of this repository runs here: no checkout and no install. The job
  # downloads what pack packed, checks it, and runs npm, which the next steps
  # install from the registry.
  publish:
    name: Publish · npm
    needs: [verify, pack]
    if: github.ref == 'refs/heads/main' && !inputs.dry_run && needs.verify.outputs.pending == 'false' && needs.pack.outputs.unpublished != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and the provenance attestation
    outputs:
      released: ${{ steps.record.outputs.released }}
    steps:
      - &download-tarballs
        name: Download the packed tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release

      - &setup-node-for-npm
        name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # OIDC trusted publishing needs npm >= 11.5.1, so the runner's bundled npm
      # can be too old to exchange the id-token — but this must NOT be
      # `npm@latest`.
      #
      # npm 12 changed `npm info <pkg> --json` to return an array where 11
      # returned the packument object. Changesets, which published from this
      # workflow until the jobs were split, read `pkgInfo.versions` off that
      # result, got `undefined`, concluded every package was unpublished, tried
      # to republish all five, and npm refused with "cannot publish over the
      # previously published versions": every release went red while the real
      # publishes succeeded. Nothing here reads `npm info` any more, but a new
      # npm major is the publishing tool changing under the release: move to it
      # on purpose, after a dry run, not whenever it ships. 11 keeps OIDC
      # (11.21 >= 11.5.1).
      - &npm-11
        name: Use an npm that supports OIDC
        run: npm install -g npm@11

      # Before anything is published: the bytes are those pack summed, every
      # tarball is the package and version the manifest names and one of the
      # five this workflow publishes, and no packed package.json keeps a range
      # that only works inside this workspace. Then npm is asked again which
      # versions it lacks, since the approval can come long after pack asked:
      # what it has now is skipped, the rest goes into to-publish.tsv in the
      # order pack packed them, dependencies first.
      - &check-tarballs
        name: Check the tarballs
        working-directory: ${{ runner.temp }}/release
        env:
          PUBLISHABLE: "@avakit/core @avakit/react @avakit/mcp @avakit/studio create-avalanche-app"
        run: |
          set -euo pipefail
          fail() { echo "::error title=Release::$*"; exit 1; }

          sha256sum --check --strict SHA256SUMS

          listed="$(jq -r '.packages[].file' manifest.json | sort)"
          summed="$(sed -E 's/^[0-9a-f]{64} [ *]//' SHA256SUMS | sort)"
          present="$(find . -maxdepth 1 -type f -name '*.tgz' -printf '%f\n' | sort)"
          [ -n "$listed" ] || fail "manifest.json lists no tarball"
          [ "$listed" = "$summed" ] || fail "manifest.json and SHA256SUMS do not list the same tarballs"
          [ "$listed" = "$present" ] || fail "the artifact does not hold exactly the tarballs manifest.json lists"

          : > "$RUNNER_TEMP/to-publish.tsv"
          : > "$RUNNER_TEMP/already-on-npm.txt"
          mapfile -t entries < <(jq -r '.packages[] | [.name, .version, .file, (.published | tostring)] | @tsv' manifest.json)
          for entry in "${entries[@]}"; do
            IFS=$'\t' read -r name version file published <<< "$entry"
            case " $PUBLISHABLE " in
              *" $name "*) ;;
              *) fail "$file is $name, which this workflow does not publish" ;;
            esac
            packed="$(tar -xzOf "$file" package/package.json)"
            [ "$(jq -r .name <<< "$packed")" = "$name" ] || fail "$file is not $name"
            [ "$(jq -r .version <<< "$packed")" = "$version" ] || fail "$file is not $name@$version"
            local_ranges="$(jq -r '[.dependencies, .peerDependencies, .optionalDependencies, .devDependencies | (. // {}) | to_entries[] | select(.value | test("^(workspace|catalog|link|file):")) | "\(.key) \(.value)"] | join(", ")' <<< "$packed")"
            [ -z "$local_ranges" ] || fail "$file still has workspace-only ranges: $local_ranges"
            # On npm before this run: an earlier release, not this one.
            [ "$published" = "false" ] || continue
            status="$(curl --silent --show-error --retry 3 --max-time 30 --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/${name/\//%2F}/$version")"
            case "$status" in
              404) printf '%s\t%s\t%s\n' "$name" "$version" "$file" >> "$RUNNER_TEMP/to-publish.tsv"
                   echo "to publish: $name@$version ($file)" ;;
              200) echo "$name@$version" >> "$RUNNER_TEMP/already-on-npm.txt"
                   echo "already on npm, skipped: $name@$version" ;;
              *) fail "the npm registry answered HTTP $status for $name@$version" ;;
            esac
          done

      # One package at a time, dependencies first, and the first failure stops
      # the job: a package is never published after one it depends on failed.
      # A re-run skips what is already on npm and publishes the rest.
      - name: Publish
        working-directory: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/published.txt"
          mapfile -t entries < "$RUNNER_TEMP/to-publish.tsv"
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "Nothing left to publish: npm has every version."
            exit 0
          fi
          for entry in "${entries[@]}"; do
            IFS=$'\t' read -r name version file <<< "$entry"
            echo "::group::npm publish $name@$version"
            npm publish "./$file" --provenance --access public --tag latest --ignore-scripts < /dev/null
            echo "::endgroup::"
            echo "$name@$version" >> "$RUNNER_TEMP/published.txt"
          done

      # Also after a failed publish: what reached npm is tagged all the same.
      - name: Record what was released
        id: record
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/already-on-npm.txt" "$RUNNER_TEMP/published.txt"
          released="$(cat "$RUNNER_TEMP/already-on-npm.txt" "$RUNNER_TEMP/published.txt" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "released=$released" >> "$GITHUB_OUTPUT"
          {
            echo "### Release · npm"
            echo
            if [ -s "$RUNNER_TEMP/published.txt" ]; then
              sed 's/^/- published: /' "$RUNNER_TEMP/published.txt"
            else
              echo "Nothing was published by this job."
            fi
            if [ -s "$RUNNER_TEMP/already-on-npm.txt" ]; then
              sed 's/^/- already on npm: /' "$RUNNER_TEMP/already-on-npm.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The tags and releases changesets/action created after it published: an
  # annotated tag `<name>@<version>` on the released commit, tagged by
  # github-actions[bot], and a release of it whose body is the CHANGELOG.md
  # entry. The script reads the changelogs and package.json files of this
  # commit and refuses a name@version that is not one of its packages. No
  # install: it uses Node.js and the GitHub API only.
  tag:
    name: Tag · GitHub releases
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.released != '' && needs.publish.outputs.released != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create tags and releases
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Tag and release what was published
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.publish.outputs.released }}
        run: node scripts/release-tags.mjs

  # The publish path without publishing: the same download, checks and npm as
  # the publish job, then `npm publish --dry-run`. No environment and no
  # id-token, so nothing here can publish.
  publish-dry-run:
    name: Publish · dry run
    needs: pack
    if: inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *download-tarballs
      - *setup-node-for-npm
      - *npm-11
      - *check-tarballs
      - name: npm publish --dry-run
        working-directory: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mapfile -t entries < "$RUNNER_TEMP/to-publish.tsv"
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "::notice title=Release dry run::npm has every version in the manifest, and refuses a version it has even in a dry run, so there is nothing to run npm publish --dry-run on. Run this on changeset-release/main to rehearse the version PR's publish."
            exit 0
          fi
          for entry in "${entries[@]}"; do
            IFS=$'\t' read -r name version file <<< "$entry"
            echo "::group::npm publish --dry-run $name@$version"
            npm publish "./$file" --dry-run --access public --tag latest --ignore-scripts < /dev/null
            echo "::endgroup::"
          done
