name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1, so the runner's bundled npm
      # can be too old to exchange the id-token — but this must NOT be `npm@latest`.
      #
      # npm 12 changed `npm info <pkg> --json` to return an array where 11 returned
      # the packument object. Changesets reads `pkgInfo.versions` off that result,
      # which is `undefined` on an array, so it concluded every package was
      # unpublished, tried to republish all five, and npm refused with "cannot
      # publish over the previously published versions" — turning every release red
      # while the real publishes actually succeeded. Pinning to 11 keeps OIDC (11.18
      # >= 11.5.1) and keeps the shape changesets can read.
      #
      # Revisit only once changesets handles npm 12's output.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate: nothing is versioned or published from a red tree.
      #
      # ci.yml runs the same checks on this push, but as a separate workflow that
      # this one does not wait for, and the "chore: version packages" PR never
      # gets a CI run of its own (GitHub starts no workflows for a pull request
      # opened with GITHUB_TOKEN). Without these steps, merging that PR published
      # whatever built, tests failing or not. So the checks run here as well, on
      # the exact commit that is about to be versioned or published, and a failure
      # stops the job before changesets/action runs. `pnpm release` below still
      # does the full build.
      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # @avakit/mcp carries @avakit/core inside its bundle, so Changesets does not
      # bump the server when core is released. This fails when a pending changeset
      # bumps core and none bumps the server, before the version PR is opened with
      # the server left behind. With no pending changesets (the publish run) it
      # passes.
      - name: Changesets · a bundled package is released with the package that contains it
        run: node scripts/check-changesets.mjs

      # The tarball itself. The tests above run the source; this packs the server,
      # installs it with an empty npm cache and drives the installed binary, which
      # is what catches a package that is green in the workspace and does not
      # start on a user's machine.
      - name: Smoke · the packed MCP server installs and starts
        run: bash scripts/smoke-mcp.sh "$RUNNER_TEMP/smoke-mcp"

      # When changesets exist on main, opens/updates a "Version Packages" PR.
      # When that PR is merged (versions bumped, changesets consumed), publishes.
      #
      # Publishing uses npm **trusted publishing (OIDC)** — no long-lived NPM_TOKEN.
      # Each package must have a Trusted Publisher configured on npmjs.com pointing
      # at this repo + `release.yml`. The exchanged id-token also produces a
      # provenance attestation, so npm can prove the tarball was built here.
      - name: Create Release PR or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
